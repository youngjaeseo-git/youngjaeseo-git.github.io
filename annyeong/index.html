<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안녕, 오늘 — 매일 아침, 캐릭터와 함께하는 날씨 인사</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #FAF3E9;
      color: #3E332A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFCF6;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(122,92,66,0.10);
      text-align: center;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #3E332A;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 16px;
      color: #857566;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(224,120,86,0.12);
      color: #E07856;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .features {
      list-style: none;
      text-align: left;
      margin-bottom: 36px;
    }
    .features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #EAE0CF;
      font-size: 15px;
      color: #3E332A;
      line-height: 1.5;
    }
    .features li:last-child { border-bottom: none; }
    .feat-icon {
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #E07856;
      color: #FFF9F2;
    }
    .btn-secondary {
      background: #F4EDE0;
      color: #857566;
    }
    .soon {
      background: #F4EDE0;
      color: #B0A190;
      cursor: not-allowed;
    }
    .soon:hover { opacity: 1; }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #B0A190;
    }
    footer a { color: #B0A190; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🌅</span>
    <h1>안녕, 오늘</h1>
    <p class="tagline">매일 아침, 귀여운 캐릭터와 함께하는<br>따뜻한 날씨 브리핑.</p>

    <div class="badge">
      <span>🔒</span> 광고 없음 · 광고 추적 없음
    </div>

    <ul class="features">
      <li><span class="feat-icon">🌤</span><span>현재 위치 실시간 날씨 + 옷차림·우산 + 시간별 차트, 한 화면에</span></li>
      <li><span class="feat-icon">🐾</span><span>4가지 캐릭터 (조약돌·냥이·곰돌이·토끼) — 날씨에 따라 표정이 바뀌어요</span></li>
      <li><span class="feat-icon">📷</span><span>내 사진을 배경으로, 카톡·인스타에 공유하는 폴라로이드 카드</span></li>
      <li><span class="feat-icon">🎒</span><span>여행지·기간을 입력하면 일자별 날씨 코칭</span></li>
    </ul>

    <div class="links">
      <!--
        출시 전: "곧 출시"(비활성). 버튼이 회색인 이유 = 아직 Play 스토어에
        등록 전이라 누를 링크가 없어서입니다. myMy 는 이미 출시돼 있어 활성.
        Play 출시 직후 아래 한 줄을 이걸로 교체하면 활성 다운로드 버튼이 됩니다:
        <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.youngjaeseo.annyeong">Google Play에서 다운로드</a>
      -->
      <a class="btn soon">Google Play 곧 출시</a>
      <a class="btn btn-secondary" href="./privacy.html">개인정보처리방침</a>
    </div>
  </div>

  <footer>© 2026 youngjaeseo · <a href="mailto:youngjae.seo@gmail.com">youngjae.seo@gmail.com</a></footer>
</body>
</html>
